name: Build APK
on:
  push:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unpack ScreenMind.zip if it was uploaded as one file
        run: if [ -f ScreenMind.zip ]; then unzip -oq ScreenMind.zip -d /tmp/sm && cp -a /tmp/sm/ScreenMind/. . ; fi
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.11.1
      - name: Download Stockfish
        run: bash scripts/fetch_stockfish.sh
   - name: Test
        run: gradle testDebugUnitTest --stacktrace
      - name: Build debug APK
        run: gradle assembleDebug --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: ScreenMind-apk
          path: app/build/outputs/apk/debug/*.apk
