{"name": "Build APK",
"on": ["push", "workflow_dispatch"],
"jobs": {"build": {"runs-on": "ubuntu-latest", "steps": [
{"uses": "actions/checkout@v4"},
{"run": "unzip -oq 'ScreenMind*.zip' -d /tmp/sm && cp -a /tmp/sm/ScreenMind/. ."},
{"uses": "actions/setup-java@v4", "with": {"distribution": "temurin", "java-version": "17"}},
{"uses": "gradle/actions/setup-gradle@v4", "with": {"gradle-version": "8.11.1"}},
{"run": "bash scripts/fetch_stockfish.sh"},
{"run": "gradle testDebugUnitTest --stacktrace"},
{"run": "gradle assembleDebug --stacktrace"},
{"uses": "actions/upload-artifact@v4", "with": {"name": "ScreenMind-apk", "path": "app/build/outputs/apk/debug/*.apk"}}
]}}}
